
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Special Forces: Black Ops</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font-family:Arial;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
#hud{position:fixed;top:12px;left:12px;background:#101820dd;padding:12px;border:1px solid #65d66e;border-radius:10px;line-height:1.6;pointer-events:none}
#help{position:fixed;top:12px;right:12px;background:#101820dd;padding:10px;border-radius:10px;font-size:12px;max-width:220px}
#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.pad{display:grid;grid-template-columns:repeat(3,48px);gap:5px;pointer-events:auto}
button{border:1px solid #a8e6a8;background:#172b24dd;color:white;border-radius:12px;font-weight:bold;min-height:46px;touch-action:none}
.pad button{font-size:19px}
#fire{width:100px;height:75px;border-radius:50%;background:#a52b20dd;border-color:#ff8a72;pointer-events:auto}
#right{display:flex;gap:8px;align-items:end;pointer-events:auto}
@media(min-width:850px){#controls{opacity:.65}.pad button{min-height:42px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <b>🚁 SPECIAL FORCES: BLACK OPS</b><br>
  Helicopter: <span id="status">READY</span><br>
  Targets hit: <span id="score">0</span><br>
  Ammo: <span id="ammo">∞</span><br>
  <span id="alt">Altitude: 100 m</span>
</div>
<div id="help">W/S: forward/back<br>A/D: turn<br>Space / Shift: rise / descend<br>Mouse click or FIRE: shoot<br>Hit the red target vehicles!</div>
<div id="controls">
  <div class="pad">
    <span></span><button data-key="w">▲</button><span></span>
    <button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button>
    <span></span><button data-key=" ">⬆</button><span></span>
  </div>
  <div id="right">
    <div class="pad"><button data-key="Shift">⬇</button><button id="fire">FIRE</button></div>
  </div>
</div>
<script>
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,keys={},shots=[],score=0,lastShot=0,camX=0,camY=0;
const player={x:0,y:0,z:100,angle:0,speed:0};
const targets=[];
function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}
addEventListener('resize',resize);resize();
for(let i=0;i<18;i++)targets.push({x:(Math.random()-.5)*2400,y:(Math.random()-.5)*2400,alive:true,size:16+Math.random()*9});
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown'].includes(e.key.toLowerCase()))e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>keys={});
document.querySelectorAll('[data-key]').forEach(b=>{
 const k=b.dataset.key.toLowerCase();
 const down=e=>{e.preventDefault();keys[k]=true};
 const up=e=>{e.preventDefault();keys[k]=false};
 b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);
 b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);
});
const fireBtn=document.getElementById('fire');
fireBtn.addEventListener('pointerdown',e=>{e.preventDefault();keys.fire=true});
['pointerup','pointerleave','pointercancel'].forEach(ev=>fireBtn.addEventListener(ev,e=>{keys.fire=false}));
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')keys.fire=true});
addEventListener('pointerup',()=>keys.fire=false);
function shoot(){
 const now=performance.now();if(now-lastShot<100)return;lastShot=now;
 const a=player.angle;
 shots.push({x:player.x+Math.cos(a)*24,y:player.y+Math.sin(a)*24,vx:Math.cos(a)*14,vy:Math.sin(a)*14,life:90});
}
function project(x,y){
 return {x:W/2+(x-player.x)*.65,y:H/2+(y-player.y)*.65};
}
function drawTarget(t){
 const p=project(t.x,t.y);
 if(p.x<-60||p.x>W+60||p.y<-60||p.y>H+60)return;
 ctx.save();ctx.translate(p.x,p.y);
 ctx.fillStyle='#bd352b';ctx.fillRect(-15,-10,30,20);
 ctx.fillStyle='#f3c9a2';ctx.fillRect(-7,-7,14,8);
 ctx.fillStyle='#222';ctx.fillRect(-20,-13,8,4);ctx.fillRect(12,-13,8,4);
 ctx.fillStyle='white';ctx.font='11px Arial';ctx.textAlign='center';ctx.fillText('TARGET',0,26);
 ctx.restore();
}
function drawHeli(){
 ctx.save();ctx.translate(W/2,H/2);ctx.rotate(player.angle);
 // shadow
 ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(3,12,25,13,0,0,Math.PI*2);ctx.fill();
 // tail boom
 ctx.fillStyle='#506d54';ctx.fillRect(-35,-4,31,8);
 ctx.fillStyle='#273c30';ctx.fillRect(-41,-12,8,24);
 // body
 ctx.fillStyle='#4f7850';ctx.beginPath();ctx.ellipse(0,0,27,17,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#8cb9c2';ctx.beginPath();ctx.ellipse(13,-3,10,10,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#17261d';ctx.fillRect(14,-2,14,4);
 // minigun barrels
 ctx.strokeStyle='#222';ctx.lineWidth=3;
 for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(26,-4+i*2);ctx.lineTo(40,-4+i*2);ctx.stroke()}
 // rotor mast and spinning rotor
 ctx.fillStyle='#263528';ctx.fillRect(-3,-3,6,6);
 ctx.strokeStyle='#171d19';ctx.lineWidth=4;
 const r=performance.now()*.035;
 ctx.beginPath();ctx.moveTo(Math.cos(r)*48,Math.sin(r)*48);ctx.lineTo(-Math.cos(r)*48,-Math.sin(r)*48);ctx.stroke();
 ctx.restore();
}
function frame(){
 // controls
 if(keys.a||keys.arrowleft)player.angle-=.045;
 if(keys.d||keys.arrowright)player.angle+=.045;
 if(keys.w||keys.arrowup)player.speed=Math.min(player.speed+.13,7);
 else if(keys.s||keys.arrowdown)player.speed=Math.max(player.speed-.13,-3);
 else player.speed*=.98;
 if(keys[' '])player.z=Math.min(600,player.z+2.3);
 if(keys.shift)player.z=Math.max(10,player.z-2.3);
 player.x+=Math.cos(player.angle)*player.speed;
 player.y+=Math.sin(player.angle)*player.speed;
 if(keys.fire)shoot();
 shots.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.life--});
 shots=shots.filter(s=>s.life>0);
 for(const s of shots)for(const t of targets){
  if(t.alive&&Math.hypot(s.x-t.x,s.y-t.y)<t.size+8){
   t.alive=false;s.life=0;score++;
   document.getElementById('score').textContent=score;
  }
 }
 ctx.fillStyle='#86a96b';ctx.fillRect(0,0,W,H);
 // grid and terrain
 ctx.strokeStyle='#72935a';ctx.lineWidth=1;
 const spacing=100,ox=(-(player.x*.65)%spacing),oy=(-(player.y*.65)%spacing);
 for(let x=ox;x<W;x+=spacing){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=oy;y<H;y+=spacing){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 // lakes / forest patches
 for(let i=0;i<8;i++){
  const x=((i*317-player.x*.3)% (W+200)+W+200)%(W+200)-100;
  const y=((i*193-player.y*.3)%(H+200)+H+200)%(H+200)-100;
  ctx.fillStyle=i%3===0?'#528da0':'#52724b';
  ctx.beginPath();ctx.ellipse(x,y,45+i%3*12,25+i%4*7,i*.7,0,Math.PI*2);ctx.fill();
 }
 targets.forEach(t=>{if(t.alive)drawTarget(t)});
 for(const s of shots){const p=project(s.x,s.y);ctx.fillStyle='#ffef87';ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill()}
 drawHeli();
 // altitude / aiming reticle
 ctx.strokeStyle='#ffffffa0';ctx.lineWidth=1;ctx.beginPath();ctx.arc(W/2,H/2,20,0,Math.PI*2);ctx.moveTo(W/2-28,H/2);ctx.lineTo(W/2-10,H/2);ctx.moveTo(W/2+10,H/2);ctx.lineTo(W/2+28,H/2);ctx.stroke();
 document.getElementById('alt').textContent='Altitude: '+Math.round(player.z)+' m';
 document.getElementById('status').textContent=player.speed>.2?'FLYING':'HOVERING';
 requestAnimationFrame(frame);
}
frame();
})();
</script>
</body>
</html>
